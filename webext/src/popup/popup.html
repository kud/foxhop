<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="../vendor/tokens.css" />
    <link rel="stylesheet" href="../vendor/webext-ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup-wide">
    <header class="header">
      <h1 class="title"><img class="logo" src="../icons/foxhop-fox.svg" alt="Fox Hop" /></h1>
      <div class="header-actions">
        <a
          class="info"
          href="https://kud.io/projects/foxhop"
          target="_blank"
          rel="noopener"
          aria-label="About Fox Hop"
          >&#9432;</a
        >
      </div>
    </header>

    <!-- Warning view (shown when native host is not connected) -->
    <div id="view-warning" hidden>
      <p class="state">
        Native host not connected.<br />
        Run <code>foxhop install</code> to get started.
      </p>
    </div>

    <!-- List view -->
    <div id="view-list">
      <button class="row-bleed action" id="add-current" type="button">
        <span class="action-icon" aria-hidden="true">+</span>
        <span class="action-label">Add current tab&hellip;</span>
      </button>

      <div class="section"><span class="section-title">Targets</span></div>

      <div class="search">
        <input
          id="search"
          type="search"
          placeholder="Search targets"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <ul class="list" id="list"></ul>
      <p class="hint add-status" id="add-status" aria-live="polite" hidden></p>
      <p class="state" id="state" hidden></p>
      <button class="row-bleed action settings-row" id="settings" type="button">
        <span class="action-icon settings-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>
        <span class="action-label">Settings</span>
      </button>
    </div>

    <!-- Edit view -->
    <form class="editor" id="editor" hidden>
      <div class="editor-name" id="editor-name"></div>
      <div class="editor-meta" id="editor-meta"></div>
      <label class="field">
        <span>URL</span>
        <input
          id="f-url"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Opened when no tab matches"
        />
      </label>
      <label class="field">
        <span>Title</span>
        <input id="f-title" type="text" autocomplete="off" />
      </label>
      <label class="field">
        <span>Match</span>
        <input id="f-match" type="text" autocomplete="off" spellcheck="false" required />
      </label>
      <label class="field-inline">
        <input id="f-navigate" type="checkbox" />
        <span>Navigate the matching tab to a requested URL</span>
      </label>
      <p class="field-note">
        With <code>foxhop focus &lt;name&gt; --url &lt;url&gt;</code>, reuse the
        existing tab instead of opening another. The URL must fall within Match.
      </p>
      <div class="editor-actions">
        <button type="button" class="btn" id="editor-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>

    <script type="module" src="popup.js"></script>
  </body>
</html>
