<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Fox Hop popup preview</title>
    <style>
      :root {
        --page-bg: #f3f3f5;
        --page-fg: #1b1b1f;
        --page-muted: #62626b;
        --page-line: #d6d6dc;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #17171a;
          --page-fg: #ececf0;
          --page-muted: #9a9aa5;
          --page-line: #34343b;
        }
      }
      body {
        margin: 0;
        padding: 32px 16px 64px;
        background: var(--page-bg);
        color: var(--page-fg);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      h2 {
        margin: 40px 0 12px;
        font-size: 16px;
      }
      p {
        margin: 0;
        color: var(--page-muted);
      }
      .pair {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-bottom: 8px;
        font-size: 12px;
        color: var(--page-muted);
      }
      iframe {
        display: block;
        width: 360px;
        height: 520px;
        border: 1px solid var(--page-line);
        border-radius: 8px;
        background: #fff;
      }
      .toolbars {
        display: grid;
        gap: 12px;
      }
      .strip {
        overflow-x: auto;
      }
      .toolbar {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 4px 8px;
        border-radius: 8px;
        min-width: max-content;
      }
      .toolbar.light {
        background: #f9f9fb;
        color: #15141a;
      }
      .toolbar.dark {
        background: #2b2a33;
        color: #fbfbfe;
      }
      .toolbar span {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 4px;
      }
      .toolbar .ours {
        background: color-mix(in srgb, currentColor 12%, transparent);
      }
      .toolbar svg,
      .toolbar img {
        width: 16px;
        height: 16px;
        display: block;
      }
      .toolbar.retina {
        padding: 8px 16px;
        border-radius: 16px;
        gap: 4px;
      }
      .toolbar.retina span {
        width: 64px;
        height: 64px;
        border-radius: 8px;
      }
      .toolbar.retina svg,
      .toolbar.retina img {
        width: 32px;
        height: 32px;
      }
      .enlarged {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .enlarged div {
        display: grid;
        place-items: center;
        width: 128px;
        height: 128px;
        border-radius: 12px;
      }
      .enlarged .light {
        background: #f9f9fb;
      }
      .enlarged .dark {
        background: #2b2a33;
      }
      .enlarged img {
        width: 96px;
        height: 96px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fox Hop popup</h1>
      <p>
        The real popup, running on fixture data. Clicks change state in memory
        only; writes are logged to each frame's console.
      </p>
      <section>
        <h2>Toolbar icon</h2>
        <p>
          The shipped toolbar icon between Firefox's own buttons (highlighted),
          at 16px and 32px, then enlarged.
        </p>
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
          <defs>
            <symbol id="ff-star" viewBox="0 0 16 16">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
                d="M8 1.9l1.9 3.8 4.2.6-3 3 .7 4.2L8 11.5l-3.8 2 .7-4.2-3-3 4.2-.6z"
              />
            </symbol>
            <symbol id="ff-cloud" viewBox="0 0 16 16">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
                d="M4.6 12.6h7.2a2.7 2.7 0 0 0 .3-5.4 4 4 0 0 0-7.7-.4 2.9 2.9 0 0 0 .2 5.8z"
              />
            </symbol>
            <symbol id="ff-puzzle" viewBox="0 0 16 16">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
                d="M2.5 5h3a1.6 1.6 0 1 1 3.2 0h2.8v2.8a1.6 1.6 0 1 1 0 3.2V13.5h-9z"
              />
            </symbol>
            <symbol id="ff-chevrons" viewBox="0 0 16 16">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.5 4.5L7 8l-3.5 3.5M8.5 4.5L12 8l-3.5 3.5"
              />
            </symbol>
            <symbol id="ff-menu" viewBox="0 0 16 16">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                d="M2.5 4h11M2.5 8h11M2.5 12h11"
              />
            </symbol>
          </defs>
        </svg>
        <div class="toolbars" id="toolbars"></div>
        <h2>Enlarged</h2>
        <div class="enlarged">
          <div class="light">
            <img
              src="../src/icons/icon-mono.svg"
              alt="Toolbar icon for light themes"
            />
          </div>
          <div class="dark">
            <img
              src="../src/icons/icon-mono-dark.svg"
              alt="Toolbar icon for dark themes"
            />
          </div>
        </div>
      </section>
      <div id="gallery"></div>
    </main>
    <script>
      const fixtures = [
        ["empty", "Empty: connected, nothing saved yet"],
        ["typical", "Typical: favourites and open tabs"],
        ["long", "Long: many targets, long titles and hosts"],
      ]
      const toolbarIcon = {
        light: "../src/icons/icon-mono.svg",
        dark: "../src/icons/icon-mono-dark.svg",
      }
      const firefoxGlyph = (id) =>
        `<span><svg><use href="#ff-${id}"/></svg></span>`
      const toolbar = (scheme, retina) =>
        `<div class="strip"><div class="toolbar ${scheme}${retina ? " retina" : ""}">` +
        firefoxGlyph("star") +
        firefoxGlyph("cloud") +
        `<span class="ours"><img src="${toolbarIcon[scheme]}" alt="Fox Hop" /></span>` +
        firefoxGlyph("puzzle") +
        firefoxGlyph("chevrons") +
        firefoxGlyph("menu") +
        `</div></div>`
      document.getElementById("toolbars").innerHTML =
        toolbar("light") +
        toolbar("dark") +
        toolbar("light", true) +
        toolbar("dark", true)

      const gallery = document.getElementById("gallery")
      for (const [name, label] of fixtures) {
        const section = document.createElement("section")
        section.innerHTML = `<h2>${label}</h2><div class="pair"></div>`
        for (const scheme of ["light", "dark"]) {
          const figure = document.createElement("figure")
          figure.innerHTML = `<figcaption>${name} / ${scheme}</figcaption>`
          const frame = document.createElement("iframe")
          frame.src = `frame.html?fixture=${name}&scheme=${scheme}`
          frame.title = `${name} fixture, ${scheme}`
          figure.append(frame)
          section.querySelector(".pair").append(figure)
        }
        gallery.append(section)
      }
    </script>
  </body>
</html>
