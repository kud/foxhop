name: AMO listing

on:
  push:
    branches: [main]
    paths: ["webext/amo/**"]
  workflow_dispatch:
    inputs:
      apply:
        description: "Send the changes to AMO (off runs a dry run)"
        type: boolean
        default: false
      force:
        description: "Replace every screenshot, even ones that look in sync"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  listing:
    uses: kud/webext/.github/workflows/amo-listing.yml@main
    with:
      root: webext
      apply: ${{ inputs.apply == true }}
      force: ${{ inputs.force == true }}
      icon: assets/icons/foxhop-128.png
    secrets: inherit
