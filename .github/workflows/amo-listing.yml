name: AMO listing

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Send the changes to AMO (off runs a dry run)"
        type: boolean
        default: false

jobs:
  amo-listing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npx -y @kud/amo-cli@0.1.1 listing push --listing webext/amo/listing.json --guid foxhop@kud.io --icon assets/icons/foxhop-128.png --screenshots webext/amo/screenshots ${{ inputs.apply && '--apply' || '' }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.MOZILLA_ADDONS_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.MOZILLA_ADDONS_JWT_SECRET }}
      - name: Record the AMO preview state
        if: ${{ inputs.apply }}
        run: |
          git add webext/amo/screenshots/.amo-previews.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --message "chore(amo): record preview state"
          git pull --rebase --quiet
          git push
